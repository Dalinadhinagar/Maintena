
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Maintena</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0fbff, #edf0ff, #f2e7ff);
            color: #172554;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            padding: 38px;
            background: white;
            border-radius: 22px;
            box-shadow: 0 18px 55px rgba(42, 63, 120, 0.13);
        }

        .brand {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #0891b2, #4f46e5, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-control {
            padding: 12px 14px;
            border: 1px solid #dbe3f0;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .create-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            background: linear-gradient(90deg, #0891b2, #4f46e5, #7c3aed);
            transition: transform 0.2s, opacity 0.2s;
        }

        .create-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .create-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 9px;
            font-size: 14px;
        }

        .message.error {
            display: block;
            color: #b91c1c;
            background: #fef2f2;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #f0fdf4;
        }

        .login-link {
            color: #4f46e5;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .register-card {
                padding: 26px 22px;
            }
        }
    </style>
</head>

<body>
    <main class="register-card">
        <div class="text-center mb-4">
            <div class="brand">Maintena.</div>
            <h2 class="h4 fw-bold mt-3">Create your account</h2>
            <p class="subtitle">
                Get started with smarter maintenance management.
            </p>
        </div>

        <div id="message" class="message mb-3" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="name" class="form-label">Full name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    minlength="2"
                    maxlength="60"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="At least 8 characters"
                    minlength="8"
                    maxlength="72"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">
                    Confirm password
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    class="form-control"
                    placeholder="Enter your password again"
                    minlength="8"
                    maxlength="72"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" id="createBtn" class="create-btn">
                Create Account
            </button>
        </form>

        <p class="text-center mt-4 mb-0 subtitle">
            Already have an account?
            <a href="/" class="login-link">Sign in</a>
        </p>

        <p class="text-center mt-3 mb-0 text-secondary small">
            Your account credentials are securely protected.
        </p>
    </main>

    <script>
        const registerForm = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const createBtn = document.getElementById("createBtn");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type + " mb-3";
        }

        registerForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (name.length < 2) {
                showMessage("Please enter a name with at least 2 characters.", "error");
                return;
            }

            if (password.length < 8 || password.length > 72) {
                showMessage("Password must contain 8 to 72 characters.", "error");
                return;
            }

            if (password !== confirmPassword) {
                showMessage("Passwords do not match.", "error");
                return;
            }

            createBtn.disabled = true;
            createBtn.textContent = "Creating account...";

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    showMessage(
                        result.message || "Unable to create your account.",
                        "error"
                    );
                    return;
                }

                showMessage("Account created successfully! Redirecting...", "success");

                window.location.href = result.redirect || "/dashboard";

            } catch (error) {
                showMessage(
                    "Unable to connect to the server. Please try again.",
                    "error"
                );
            } finally {
                createBtn.disabled = false;
                createBtn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
